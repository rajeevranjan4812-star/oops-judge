<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Code-Karo.dev profile and coding activity.">
  <title>Profile — Code-Karo.dev</title>
  <link rel="stylesheet" href="/navbar.css">
  <link rel="stylesheet" href="/gooey-nav.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --page-bg: #101014;
      --page-surface: #17181e;
      --page-surface-raised: #202127;
      --page-border: rgba(190, 194, 205, .16);
      --page-muted: #92949e;
      --surface: var(--page-surface);
      --surface-raised: var(--page-surface-raised);
      --border: var(--page-border);
      --muted: var(--page-muted);
      --cell-size: 12px;
      --cell-gap: 3px;
      --cell-step: 15px;
      --chart-scale-01: #1a1726;
      --chart-scale-02: #38246e;
      --chart-scale-03: #5833a6;
      --chart-scale-04: #784bff;
      --chart-scale-05: #26d7f4;
      --chart-cell-border: rgba(220, 229, 247, .06);
      background: var(--page-bg);
      color: #e4e4e8;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page-bg: #f0f0f2;
      --page-surface: #ffffff;
      --page-surface-raised: #ebebee;
      --page-border: rgba(32, 33, 38, .14);
      --page-muted: #696b74;
      --chart-scale-01: #e9e6f2;
      --chart-scale-02: #c4b3ef;
      --chart-scale-03: #9b7de6;
      --chart-scale-04: #7345db;
      --chart-scale-05: #0e9fba;
      --chart-cell-border: rgba(32, 33, 38, .12);
      color: #202126;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    a { color: inherit; }

    .navbar {
      position: sticky;
      z-index: 5;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 0 clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--border);
      background: var(--page-surface);
    }

    .navbar .theme-switch { position: absolute; right: clamp(20px, 5vw, 72px); }
    .navbar .repository-link { position: absolute; left: clamp(20px, 5vw, 72px); }
    main {
      width: min(100% - 40px, 1040px);
      margin: 52px auto;
    }

    .profile-heading {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .avatar {
      display: grid;
      width: 58px;
      height: 58px;
      flex: none;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--page-surface-raised);
      color: #e4e4e8;
      font-size: 19px;
      font-weight: 600;
    }

    h1 { margin: 0 0 4px; font-size: 25px; font-weight: 600; letter-spacing: -.03em; }
    .username { color: var(--muted); font-size: 14px; }
    .card {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-raised);
    }

    .stat-value { display: block; margin-bottom: 4px; font-size: 23px; font-weight: 600; }
    .stat-label { color: var(--muted); font-size: 12px; }
    .activity-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h2 { margin: 0 0 5px; font-size: 16px; font-weight: 600; }
    .activity-summary { color: var(--muted); font-size: 12px; }
    .chart-scroll { margin-top: 20px; overflow-x: auto; padding-bottom: 8px; }
    .chart { width: max-content; }
    .months {
      position: relative;
      width: calc(var(--weeks) * var(--cell-step));
      height: 20px;
      color: var(--muted);
      font-size: 11px;
    }
    .months span { position: absolute; left: calc(var(--week) * var(--cell-step)); }
    .chart-body { display: flex; gap: 8px; }
    .weekdays {
      display: grid;
      grid-template-rows: repeat(7, var(--cell-size));
      gap: var(--cell-gap);
      width: 24px;
      color: var(--muted);
      font-size: 10px;
    }
    .weekdays span { height: var(--cell-size); line-height: var(--cell-size); }
    .cells {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: var(--cell-size);
      grid-template-rows: repeat(7, var(--cell-size));
      gap: var(--cell-gap);
      width: max-content;
    }
    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border: 1px solid var(--chart-cell-border, rgba(220, 229, 247, .06));
      border-radius: 2px;
      background: var(--chart-scale-01);
    }
    .cell[data-level="1"] { background: var(--chart-scale-02); }
    .cell[data-level="2"] { background: var(--chart-scale-03); }
    .cell[data-level="3"] { background: var(--chart-scale-04); }
    .cell[data-level="4"] { background: var(--chart-scale-05); }
    .cell.future { visibility: hidden; }
    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend .cell { display: inline-block; }
    .empty-state {
      margin-top: 20px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-raised);
      color: var(--page-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 560px) {
      main { width: min(100% - 28px, 1040px); margin: 30px auto; }
      .card { padding: 16px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-value { font-size: 20px; }
      .profile-heading { gap: 13px; }
      .avatar { width: 50px; height: 50px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a class="repository-link" href="https://github.com/rajeevranjan4812-star/oops-judge" target="_blank" rel="noopener noreferrer" aria-label="Open the Code-Karo.dev GitHub repository" title="GitHub repository">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.68 3.76 2.03.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.24-5.1 5.51.4.35.75 1.02.75 2.06V22c0 .29.2.63.76.53A11.1 11.1 0 0 0 12 .9Z"/></svg>
    </a>
    <button class="theme-switch" data-theme-switch type="button" aria-label="Switch theme" aria-pressed="false">
      <svg class="theme-switch__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <g class="theme-switch__sun-rays" stroke="currentColor" stroke-linecap="round" stroke-width="1.7">
          <circle cx="12" cy="12" r="3.7" fill="currentColor" stroke="none" />
          <path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4m12.4 12.4 1.4 1.4M2.5 12h2m15 0h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4" />
        </g>
        <g class="theme-switch__moon">
          <circle cx="12" cy="12" r="7.5" fill="currentColor" />
          <circle class="theme-switch__moon-cutout" cx="16" cy="8" r="6" />
        </g>
      </svg>
      <span class="theme-switch__label" data-theme-label>Dark</span>
    </button>
    <nav class="nav-island" data-nav-island aria-label="Main sections">
      <a class="nav-island__brand" href="/" aria-label="CodeKaro home">CodeKaro</a>
      <div class="nav-island__links">
        <a class="nav-island__link" href="/" data-nav-link>Home</a>
        <a class="nav-island__link" href="/dashboard" data-nav-link>Dashboard</a>
        <a class="nav-island__link" href="/profile" data-nav-link>Profile</a>
        <a class="nav-island__link" href="/practice" data-nav-link>Practice</a>
      </div>
    </nav>
  </header>
  <main>
    <header class="profile-heading">
      <div id="avatar" class="avatar" aria-hidden="true">CK</div>
      <div>
        <h1 id="profile-name">Your profile</h1>
        <div id="profile-username" class="username">Code-Karo.dev</div>
      </div>
    </header>
    <section class="card" aria-labelledby="activity-title">
      <div class="stats">
        <div class="stat"><span id="contribution-count" class="stat-value">0</span><span class="stat-label">Submissions this year</span></div>
        <div class="stat"><span id="streak-count" class="stat-value">0</span><span class="stat-label">Day streak</span></div>
        <div class="stat"><span id="solved-count" class="stat-value">0</span><span class="stat-label">Problems solved</span></div>
      </div>
      <div class="activity-heading">
        <h2 id="activity-title">Coding activity</h2>
        <span id="activity-summary" class="activity-summary">Past year</span>
      </div>
      <div class="chart-scroll">
        <div class="chart">
          <div id="month-labels" class="months"></div>
          <div class="chart-body">
            <div class="weekdays" aria-hidden="true"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
            <div id="heatmap" class="cells" role="img" aria-label="Submission activity over the past year"></div>
          </div>
        </div>
      </div>
      <div class="legend" aria-label="Submission levels">
        <span>Less</span><span class="cell" aria-hidden="true"></span><span class="cell" data-level="1" aria-hidden="true"></span><span class="cell" data-level="2" aria-hidden="true"></span><span class="cell" data-level="3" aria-hidden="true"></span><span class="cell" data-level="4" aria-hidden="true"></span><span>More</span>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <p style="margin:0 0 14px;">Sign in and submit solutions in Practice to build your activity heatmap.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <a href="/auth" style="display:inline-flex;align-items:center;padding:7px 14px;border-radius:6px;background:var(--page-surface-raised);border:1px solid var(--border);font-weight:600;font-size:12.5px;text-decoration:none;">Sign In</a>
          <a href="/practice" style="display:inline-flex;align-items:center;padding:7px 14px;border-radius:6px;background:var(--page-surface-raised);border:1px solid var(--border);font-weight:600;font-size:12.5px;text-decoration:none;">Start Practice ➔</a>
        </div>
      </div>
    </section>
  </main>
  <script src="/gooey-nav.js" defer></script>
  <script>
    (() => {
      const $ = selector => document.querySelector(selector);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayKey = dateKey(today);
      const storedUser = readUser();
      const name = storedUser && typeof storedUser.username === "string" ? storedUser.username : "Guest";
      $("#profile-name").textContent = name;
      $("#profile-username").textContent = storedUser ? `@${name}` : "Code-Karo.dev";
      $("#avatar").textContent = name.slice(0, 2).toUpperCase();

      const submissionsByDay = new Map();
      let storageReadable = true;
      if (storedUser && typeof storedUser.id === "string") {
        try {
          const prefix = `oops_sub:${storedUser.id}:`;
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (!key || !key.startsWith(prefix)) continue;
            const records = JSON.parse(localStorage.getItem(key) || "[]");
            if (!Array.isArray(records)) continue;
            records.forEach(record => {
              if (!record || typeof record.time !== "string") return;
              const date = new Date(record.time);
              if (Number.isNaN(date.getTime())) return;
              const key = dateKey(date);
              submissionsByDay.set(key, (submissionsByDay.get(key) || 0) + 1);
            });
          }
        } catch (error) {
          storageReadable = false;
        }
      }

      let solved = 0;
      if (storedUser && typeof storedUser.id === "string" && storageReadable) {
        try {
          const prefix = `oops_status:${storedUser.id}:`;
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (key && key.startsWith(prefix) && localStorage.getItem(key) === "solved") solved += 1;
          }
        } catch (error) {
          storageReadable = false;
        }
      }

      const total = [...submissionsByDay.values()].reduce((sum, count) => sum + count, 0);
      $("#contribution-count").textContent = total.toLocaleString();
      $("#solved-count").textContent = solved.toLocaleString();
      $("#streak-count").textContent = calculateStreak(submissionsByDay, today);
      $("#activity-summary").textContent = `${total.toLocaleString()} submissions in the past year`;
      $("#empty-state").hidden = total > 0 || !storageReadable;
      if (!storageReadable) $("#empty-state").textContent = "Could not read local activity data in this browser.";
      renderHeatmap(submissionsByDay, today, todayKey);

      function readUser() {
        try {
          const user = JSON.parse(localStorage.getItem("oops_session") || "null");
          return user && typeof user === "object" ? user : null;
        } catch (error) {
          return null;
        }
      }

      function dateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function calculateStreak(counts, date) {
        const cursor = new Date(date);
        if (!counts.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1);
        let streak = 0;
        while (counts.has(dateKey(cursor))) {
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function renderHeatmap(counts, endDate, endKey) {
        const startDate = new Date(endDate);
        startDate.setDate(startDate.getDate() - 364);
        startDate.setDate(startDate.getDate() - startDate.getDay());
        const dayCount = Math.round((endDate - startDate) / 86400000) + 1;
        const weekCount = Math.ceil(dayCount / 7);
        $(".chart").style.setProperty("--weeks", weekCount);
        const heatmap = $("#heatmap");
        const months = $("#month-labels");
        const monthSlots = new Set();

        for (let week = 0; week < weekCount; week += 1) {
          for (let weekday = 0; weekday < 7; weekday += 1) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + week * 7 + weekday);
            const key = dateKey(date);
            const future = key > endKey;
            const count = future ? 0 : (counts.get(key) || 0);
            const level = count === 0 ? 0 : count === 1 ? 1 : count <= 3 ? 2 : count <= 6 ? 3 : 4;
            const cell = document.createElement("span");
            cell.className = `cell${future ? " future" : ""}`;
            cell.dataset.level = String(level);
            if (!future) cell.title = `${date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })}: ${count} submission${count === 1 ? "" : "s"}`;
            heatmap.appendChild(cell);

            const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
            if (date.getDate() === 1 && !monthSlots.has(monthKey)) {
              monthSlots.add(monthKey);
              const label = document.createElement("span");
              label.textContent = date.toLocaleDateString(undefined, { month: "short" });
              label.style.setProperty("--week", week);
              months.appendChild(label);
            }
          }
        }
      }
    })();
  </script>
</body>
</html>
