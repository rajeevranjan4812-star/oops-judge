<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sign in or create your CodeKaro account — a calmer place to practice code.">
  <title>CodeKaro — Sign In</title>

  <!-- Fonts (including futuristic Zen Dots, Audiowide, Michroma) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Lexend+Giga:wght@100..900&family=Michroma&family=Play:wght@400;700&family=Zen+Dots&display=swap" rel="stylesheet">

  <!-- Site theme system (MUST come before body renders) -->
  <link rel="stylesheet" href="/assets/tailwind.css">
  <link rel="stylesheet" href="./navbar.css">
  <link rel="stylesheet" href="./theme.css">
  <script src="./theme.js"></script>

  <style>
    /* ══════════════════════════════════════════════════════
       1. DESIGN TOKENS — DARK (Pure Black & White Monochrome)
       ══════════════════════════════════════════════════════ */
    :root {
      color-scheme: dark;
      font-family: "Play", ui-sans-serif, system-ui, sans-serif;

      /* Card & Surface — Full Black for Dark Mode */
      --ck-card-bg:      #000000;
      --ck-card-border:  rgba(255, 255, 255, 0.14);
      --ck-card-shadow:  0 28px 80px rgba(0, 0, 0, 0.85);
      --ck-form-surface: #0a0a0a;

      /* Borders */
      --ck-border:       rgba(255, 255, 255, 0.16);
      --ck-border-hover: rgba(255, 255, 255, 0.45);
      --ck-border-focus: #ffffff;

      /* Typography */
      --ck-text:  #ffffff;
      --ck-muted: #8c8c94;
      --ck-link:  #ffffff;

      /* Monochrome Accent */
      --ck-accent:       #ffffff;
      --ck-accent-fg:    #000000;
      --ck-accent-glow:  rgba(255, 255, 255, 0.14);
      --ck-accent-soft:  rgba(255, 255, 255, 0.08);

      /* Semantic */
      --ck-success: #ffffff;
      --ck-error:   #ff4a6e;

      /* Inputs */
      --ck-input-bg: #080808;

      /* Nav */
      --ck-nav-bg:     rgba(0, 0, 0, 0.72);
      --ck-nav-border: rgba(255, 255, 255, 0.10);

      /* Radii */
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 28px;
    }

    /* ══════════════════════════════════════════════════════
       2. DESIGN TOKENS — LIGHT (Pure White & Black Monochrome)
       ══════════════════════════════════════════════════════ */
    html[data-theme="light"] {
      color-scheme: light;

      /* Card & Surface — Full White for Light Mode */
      --ck-card-bg:      #ffffff;
      --ck-card-border:  rgba(0, 0, 0, 0.12);
      --ck-card-shadow:  0 28px 80px rgba(0, 0, 0, 0.38);
      --ck-form-surface: #f4f4f5;

      /* Borders */
      --ck-border:       rgba(0, 0, 0, 0.15);
      --ck-border-hover: rgba(0, 0, 0, 0.45);
      --ck-border-focus: #000000;

      /* Typography */
      --ck-text:  #000000;
      --ck-muted: #5c5c66;
      --ck-link:  #000000;

      /* Monochrome Accent */
      --ck-accent:       #000000;
      --ck-accent-fg:    #ffffff;
      --ck-accent-glow:  rgba(0, 0, 0, 0.10);
      --ck-accent-soft:  rgba(0, 0, 0, 0.06);

      /* Semantic */
      --ck-success: #000000;
      --ck-error:   #d92b4b;

      /* Inputs */
      --ck-input-bg: #fafafa;

      /* Nav */
      --ck-nav-bg:     rgba(255, 255, 255, 0.85);
      --ck-nav-border: rgba(0, 0, 0, 0.10);
    }

    /* ══════════════════════════════════════════════════════
       3. RESET & FULL-PAGE BACKGROUND IMAGE
       ══════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000000 url("./footer-gradient.jpg") center bottom / cover no-repeat fixed, #000000 url("footer-gradient.jpg") center bottom / cover no-repeat fixed, #000000 url("/footer-gradient.jpg") center bottom / cover no-repeat fixed, linear-gradient(135deg, #120f17 0%, #1c1528 50%, #0d0c10 100%);
      color: var(--ck-text);
      transition: color .25s ease;
    }

    /* ══════════════════════════════════════════════════════
       4. QUEUE TEXT ANIMATION KEYFRAMES
       ══════════════════════════════════════════════════════ */
    @keyframes queue-char-in {
      0% {
        opacity: 0;
        transform: translateY(28px) scale(0.88);
        filter: blur(8px);
      }
      60% {
        opacity: 1;
        transform: translateY(-3px) scale(1.02);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    @keyframes queue-char-wave {
      0%, 75%, 100% {
        transform: translateY(0);
        text-shadow:
          0 0 24px rgba(255, 255, 255, 0.35),
          0 4px 28px rgba(0, 0, 0, 0.85);
      }
      88% {
        transform: translateY(-6px);
        text-shadow:
          0 0 32px rgba(255, 255, 255, 0.9),
          0 0 60px rgba(255, 255, 255, 0.45);
      }
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ══════════════════════════════════════════════════════
       5. NAVBAR
       ══════════════════════════════════════════════════════ */
    .auth-nav {
      position: fixed; z-index: 50; inset: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(20px,5vw,56px); min-height: 68px;
      border-bottom: 1px solid var(--ck-nav-border);
      background: var(--ck-nav-bg);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transition: background .25s ease, border-color .25s ease;
    }

    .auth-nav__brand {
      font-family: "Audiowide", sans-serif; font-size: 18px; font-weight: 600;
      letter-spacing: -0.03em; color: var(--ck-text); text-decoration: none;
      display: flex; align-items: center; gap: 9px;
      transition: color .2s;
    }

    .auth-nav__brand-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--ck-text);
    }

    .auth-nav__right { display: flex; align-items: center; gap: 10px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 36px; padding: 0 14px;
      border: 1px solid var(--ck-border); border-radius: var(--r-sm);
      background: var(--ck-card-bg);
      color: var(--ck-text); font-family: "Play",sans-serif; font-size: 13px; font-weight: 600;
      text-decoration: none;
      transition: color .18s, border-color .18s, background .18s;
    }
    .back-link:hover { border-color: var(--ck-border-hover); background: var(--ck-accent-soft); }
    .back-link svg { width: 14px; height: 14px; }

    /* ══════════════════════════════════════════════════════
       6. PAGE LAYOUT (Full-bleed background image across all)
       ══════════════════════════════════════════════════════ */
    .auth-page {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      padding-top: 68px;
      background: transparent;
    }

    /* ══════════════════════════════════════════════════════
       7. LEFT HERO PANEL — Futuristic Queue Text + GitHub
       ══════════════════════════════════════════════════════ */
    .auth-panel-left {
      position: relative;
      overflow: hidden;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
    }

    .auth-panel-left__content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }

    /* Futuristic "Code Karo" Heading with Queue Text Animation */
    .futuristic-heading {
      font-family: "Zen Dots", "Audiowide", "Michroma", sans-serif;
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: nowrap;
      white-space: nowrap;
      user-select: none;
      text-shadow:
        0 0 24px rgba(255, 255, 255, 0.35),
        0 4px 28px rgba(0, 0, 0, 0.85);
    }

    .queue-char {
      display: inline-block;
      opacity: 0;
      animation:
        queue-char-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards,
        queue-char-wave 4.2s ease-in-out infinite;
      animation-delay:
        calc(var(--char-index, 0) * 95ms),
        calc(900ms + var(--char-index, 0) * 110ms);
    }

    .queue-char--space {
      width: 0.32em;
    }

    .futuristic-cursor {
      display: inline-block;
      width: 0.08em;
      height: 0.82em;
      margin-left: 0.14em;
      border-radius: 2px;
      background: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.9);
      animation: cursor-blink 1.05s steps(2, jump-none) infinite;
    }

    /* Minimal Clean GitHub Link on Left Panel */
    .left-github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 11px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: #000000;
      color: #ffffff;
      font-family: "Michroma", "Play", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .left-github-link:hover,
    .left-github-link:focus-visible {
      transform: translateY(-2px);
      border-color: #ffffff;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      outline: none;
    }

    .left-github-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════════════════
       8. RIGHT FORM PANEL — Rounded Card (Full Black Dark / Full White Light)
       ══════════════════════════════════════════════════════ */
    .auth-panel-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 5vh, 56px) clamp(20px, 5vw, 56px);
      background: transparent;
    }

    .auth-form-card {
      width: 100%;
      max-width: 430px;
      padding: clamp(28px, 4vw, 40px);
      border-radius: var(--r-lg);
      background: var(--ck-card-bg);
      border: 1px solid var(--ck-card-border);
      box-shadow: var(--ck-card-shadow);
      color: var(--ck-text);
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* ── Heading ── */
    .auth-heading {
      font-size: clamp(22px, 2.8vw, 30px);
      font-family: "Lexend Giga", sans-serif;
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1.14;
      color: var(--ck-text);
      margin-bottom: 6px;
    }

    .auth-sub {
      color: var(--ck-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    /* ── Tabs (Monochrome Black & White) ── */
    .auth-tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: var(--ck-form-surface);
      border: 1px solid var(--ck-border);
      margin-bottom: 24px;
      transition: background .25s, border-color .25s;
    }

    .auth-tab {
      flex: 1;
      min-height: 38px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--ck-muted);
      font-family: "Play", sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    .auth-tab.is-active {
      background: var(--ck-accent);
      color: var(--ck-accent-fg);
    }

    /* ── Auth panels ── */
    .auth-panel { display: none; }
    .auth-panel.is-visible { display: block; }

    /* ── Form fields ── */
    .form-group { position: relative; margin-bottom: 14px; }

    .form-label {
      display: block;
      margin-bottom: 6px;
      color: var(--ck-muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      min-height: 46px;
      padding: 0 44px 0 16px;
      border: 1px solid var(--ck-border);
      border-radius: var(--r-md);
      background: var(--ck-input-bg);
      color: var(--ck-text);
      font-family: "Play", sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .form-input::placeholder { color: var(--ck-muted); opacity: 0.7; }

    .form-input:focus {
      border-color: var(--ck-border-focus);
      box-shadow: 0 0 0 3px var(--ck-accent-glow);
    }

    .form-input.has-error {
      border-color: var(--ck-error);
      box-shadow: 0 0 0 3px rgba(255, 74, 110, 0.14);
    }

    .input-icon-wrap { position: relative; }

    .form-input-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ck-muted);
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: color .18s;
    }
    .form-input-icon:hover { color: var(--ck-text); }
    .form-input-icon svg { width: 18px; height: 18px; }

    .form-error { display: none; margin-top: 5px; color: var(--ck-error); font-size: 12px; }

    /* ── Password strength (Monochrome) ── */
    .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
    .strength-seg { flex: 1; height: 3px; border-radius: 3px; background: var(--ck-border); transition: background .3s; }
    .strength-seg.weak   { background: var(--ck-muted); }
    .strength-seg.medium { background: var(--ck-text); opacity: 0.65; }
    .strength-seg.strong { background: var(--ck-text); }

    /* ── Submit CTA (Pure Black & White Monochrome) ── */
    .auth-submit {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      padding: 0 24px;
      border: 1px solid var(--ck-accent);
      border-radius: 999px;
      background: var(--ck-accent);
      color: var(--ck-accent-fg);
      font-family: "Lexend Giga", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }

    .auth-submit:hover, .auth-submit:focus-visible {
      transform: translateY(-2px);
      opacity: 0.92;
      box-shadow: 0 8px 24px var(--ck-accent-glow);
      outline: none;
    }
    .auth-submit:active { transform: translateY(0); }

    /* ── Divider ── */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--ck-muted);
      font-size: 12px;
      font-weight: 500;
    }
    .auth-divider::before, .auth-divider::after {
      flex: 1;
      height: 1px;
      background: var(--ck-border);
      content: "";
    }

    /* ── OAuth buttons (Logo Only — Black & White Theme) ── */
    .oauth-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .oauth-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border: 1px solid var(--ck-border);
      border-radius: var(--r-md);
      background: var(--ck-form-surface);
      color: var(--ck-text);
      text-decoration: none;
      cursor: pointer;
      transition: border-color .18s, background .18s, color .18s, transform .18s;
    }
    .oauth-btn:hover,
    .oauth-btn:focus-visible {
      border-color: var(--ck-accent);
      background: var(--ck-accent);
      color: var(--ck-accent-fg);
      transform: translateY(-2px);
      outline: none;
    }
    .oauth-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ── Switch prompt ── */
    .auth-switch { margin-top: 22px; text-align: center; color: var(--ck-muted); font-size: 13px; }
    .auth-switch a { color: var(--ck-text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; transition: opacity .18s; }
    .auth-switch a:hover { opacity: 0.75; }

    /* ── Form row helpers ── */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ck-muted);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .form-check input { width: 16px; height: 16px; accent-color: var(--ck-accent); cursor: pointer; }
    .form-link { color: var(--ck-text); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; transition: opacity .18s; }
    .form-link:hover { opacity: 0.75; }

    .provider-help-box {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--ck-border);
      background: var(--ck-form-surface);
      color: var(--ck-text);
      font-size: 12px;
      line-height: 1.55;
    }
    .provider-help-box.is-visible { display: block; }
    .provider-help-box code {
      font-family: monospace;
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--ck-accent-soft);
      word-break: break-all;
    }

    /* ══════════════════════════════════════════════════════
       9. TOAST
       ══════════════════════════════════════════════════════ */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; border-radius: var(--r-md);
      border: 1px solid var(--ck-border-hover);
      background: var(--ck-card-bg); color: var(--ck-text);
      font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      opacity: 0; z-index: 999;
      transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
      white-space: nowrap;
    }
    .toast.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast--error { border-color: var(--ck-error); }
    .toast__icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* ══════════════════════════════════════════════════════
       10. LOADING SPINNER
       ══════════════════════════════════════════════════════ */
    .oauth-spinner {
      display: none; position: fixed; inset: 0; z-index: 200;
      align-items: center; justify-content: center; flex-direction: column; gap: 20px;
      background: rgba(0, 0, 0, 0.85);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      color: #ffffff; font-size: 15px; font-weight: 600;
    }
    .oauth-spinner.is-active { display: flex; }

    .spinner-ring {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      animation: spin-ring .8s linear infinite;
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }

    /* ══════════════════════════════════════════════════════
       11. RESPONSIVE
       ══════════════════════════════════════════════════════ */
    @media (max-width: 820px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-panel-left {
        min-height: 200px;
        padding: 36px 24px 12px;
      }
      .auth-panel-right {
        padding: 16px clamp(16px, 5vw, 32px) 48px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .queue-char { opacity: 1 !important; transform: none !important; filter: none !important; }
    }
  </style>
  <script type="module" src="/src/auth-client.ts"></script>
</head>
<body>

  <!-- ─────────────────────────── NAVBAR ─────────────────────────── -->
  <nav class="auth-nav" role="navigation" aria-label="Auth navigation">
    <a class="auth-nav__brand" href="./index.html" aria-label="CodeKaro Home">
      <span class="auth-nav__brand-dot" aria-hidden="true"></span>
      CodeKaro
    </a>
    <div class="auth-nav__right">
      <button class="theme-switch theme-switch--compact" data-theme-switch type="button"
              aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-switch__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g class="theme-switch__sun-rays" stroke="currentColor" stroke-linecap="round" stroke-width="1.7">
            <circle cx="12" cy="12" r="3.7" fill="currentColor" stroke="none"/>
            <path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4m12.4 12.4 1.4 1.4M2.5 12h2m15 0h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4"/>
          </g>
          <g class="theme-switch__moon">
            <circle cx="12" cy="12" r="7.5" fill="currentColor"/>
            <circle class="theme-switch__moon-cutout" cx="16" cy="8" r="6"/>
          </g>
        </svg>
        <span class="theme-switch__label" data-theme-label>Dark</span>

  <!-- ─────────────────────── SCRIPTS ─────────────────────── -->
  <script>
  /* ═══════════════════════════════════════════════════════════
     THEME CONTROLLER (Standalone fallback + theme.js sync)
     ═══════════════════════════════════════════════════════════ */
  (function initTheme() {
    function readSavedTheme() {
      try {
        const stored = localStorage.getItem("code-karo-theme");
        if (stored === "light" || stored === "dark") return stored;
      } catch (e) {}
      return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    }
    function updateThemeUI(t) {
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.style.colorScheme = t;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = t === "dark" ? "#000000" : "#ffffff";
      document.querySelectorAll("[data-theme-switch]").forEach(btn => {
        const next = t === "dark" ? "light" : "dark";
        btn.setAttribute("aria-label", `Switch to ${next} theme`);
        btn.setAttribute("aria-pressed", String(t === "dark"));
        btn.title = `Switch to ${next} theme`;
        const label = btn.querySelector("[data-theme-label]");
        if (label) label.textContent = t === "dark" ? "Dark" : "Light";
      });
    }
    const currentTheme = readSavedTheme();
    updateThemeUI(currentTheme);

    document.addEventListener("click", e => {
      const btn = e.target.closest("[data-theme-switch]");
      if (!btn) return;
      const active = document.documentElement.getAttribute("data-theme") || "dark";
      const next = active === "dark" ? "light" : "dark";
      try { localStorage.setItem("code-karo-theme", next); } catch (err) {}
      updateThemeUI(next);
    });
  })();

  function getAppUrl(path) {
    if (window.location.protocol === 'file:') {
      const clean = path.replace(/^\//, '') || 'index';
      return './' + (clean.endsWith('.html') ? clean : clean + '.html');
    }
    return path;
  }

  /* ═══════════════════════════════════════════════════════════
     ACCOUNT & SESSION STORAGE HELPERS
     (Synchronized with app.js, problems.js, and profile.html)
     ═══════════════════════════════════════════════════════════ */
  function getStoredAccounts() {
    try {
      return JSON.parse(localStorage.getItem("oops_accounts") || "{}");
    } catch {
      return {};
    }
  }

  function saveStoredAccounts(accounts) {
    try {
      localStorage.setItem("oops_accounts", JSON.stringify(accounts));
    } catch (e) {
      console.warn("Could not save accounts to localStorage", e);
    }
  }

  function generateSalt() {
    const bytes = new Uint8Array(16);
    if (window.crypto && crypto.getRandomValues) {
      crypto.getRandomValues(bytes);
    } else {
      for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function hashPassword(password, salt) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      const enc = new TextEncoder();
      const data = enc.encode(`${salt}:${password}`);
      const digest = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    let h = 0x811c9dc5;
    const s = `${salt}:${password}`;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
    }
    return (h >>> 0).toString(16);
  }

  function setAppSession(userObj) {
    const cleanHandle = (userObj.username || (userObj.email ? userObj.email.split('@')[0] : 'Coder'))
      .toLowerCase().replace(/[^a-z0-9_-]/g, '_');
    const session = {
      id: userObj.id || userObj.uid || ("u_" + cleanHandle + "_" + Date.now().toString(36)),
      uid: userObj.uid || userObj.id || "",
      username: cleanHandle,
      name: userObj.name || userObj.displayName || userObj.username || cleanHandle,
      email: userObj.email || "",
      picture: userObj.picture || userObj.avatar || userObj.photoURL || "",
      avatar: userObj.picture || userObj.avatar || userObj.photoURL || "",
      provider: userObj.provider || "email",
      createdAt: userObj.createdAt || Date.now()
    };
    try {
      localStorage.setItem("oops_session", JSON.stringify(session));
      localStorage.setItem("ck_user", JSON.stringify(session));
    } catch (e) {
      console.warn("Could not write session to localStorage", e);
    }
    return session;
  }

  async function waitForFirebaseClient(timeoutMs = 12000) {
    if (window.CodeKaroAuth) return window.CodeKaroAuth;
    // Fast path: attempt immediate dynamic import
    try {
      const mod = await import('/src/auth-client.ts').catch(() => import('/assets/auth-client.js'));
      if (window.CodeKaroAuth) return window.CodeKaroAuth;
      if (mod && (mod.CodeKaroAuth || mod.default)) {
        window.CodeKaroAuth = mod.CodeKaroAuth || mod.default;
        return window.CodeKaroAuth;
      }
    } catch (_e) {}
    if (window.CodeKaroAuth) return window.CodeKaroAuth;
    return new Promise((resolve, reject) => {
      if (window.CodeKaroAuth) {
        resolve(window.CodeKaroAuth);
        return;
      }
      const interval = setInterval(() => {
        if (window.CodeKaroAuth) {
          clearInterval(interval);
          clearTimeout(timer);
          resolve(window.CodeKaroAuth);
        }
      }, 50);
      const timer = setTimeout(() => {
        clearInterval(interval);
        if (window.CodeKaroAuth) {
          resolve(window.CodeKaroAuth);
        } else {
          reject(new Error("Firebase SDK is still loading. Please try again in a moment."));
        }
      }, timeoutMs);
      window.addEventListener("codekaro-firebase-ready", (e) => {
        clearInterval(interval);
        clearTimeout(timer);
        resolve(e.detail || window.CodeKaroAuth);
      }, { once: true });
    });
  }

  window.addEventListener('codekaro-redirect-login', (e) => {
    const profile = e.detail;
    if (profile) {
      const accounts = getStoredAccounts();
      if (profile.email) accounts[profile.email.toLowerCase()] = profile;
      accounts[profile.username.toLowerCase()] = profile;
      saveStoredAccounts(accounts);
      setAppSession(profile);
      showToast(`Welcome back, ${profile.name}!`);
      setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
    }
  });

  function showProviderSetupNote(providerName) {
    const projectId = (window.CodeKaroAuth && window.CodeKaroAuth.firebaseConfig && window.CodeKaroAuth.firebaseConfig.projectId) || 'integrated-canto-x5v9p';
    const authDomain = (window.CodeKaroAuth && window.CodeKaroAuth.firebaseConfig && window.CodeKaroAuth.firebaseConfig.authDomain) || `${projectId}.firebaseapp.com`;
    const consoleUrl = `https://console.firebase.google.com/project/${projectId}/authentication/providers`;
    const html = `
      <strong>Enable ${providerName} in Firebase Console:</strong><br/>
      1. Open <a href="${consoleUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--ck-text);text-decoration:underline;">Firebase Auth Providers (${projectId})</a><br/>
      2. Click <strong>${providerName}</strong> &rarr; toggle <strong>Enable</strong> &rarr; Save.<br/>
      ${providerName === 'GitHub' ? `3. In your GitHub OAuth App settings, set Authorization callback URL to:<br/><code>https://${authDomain}/__/auth/handler</code>` : ''}
    `;
    ['provider-help-login', 'provider-help-signup'].forEach(id => {
      const box = document.getElementById(id);
      if (box) {
        box.innerHTML = html;
        box.classList.add('is-visible');
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════
     FIREBASE GOOGLE AUTHENTICATION (Sign In & Sign Up)
     ═══════════════════════════════════════════════════════════ */
  async function startGoogleOAuth() {
    showSpinner('Connecting to Google…');
    try {
      const fb = await waitForFirebaseClient(12000);
      const profile = await fb.signInWithGoogle();
      const accounts = getStoredAccounts();
      if (profile.email) accounts[profile.email.toLowerCase()] = profile;
      accounts[profile.username.toLowerCase()] = profile;
      saveStoredAccounts(accounts);
      setAppSession(profile);
      hideSpinner();
      showToast(`Signed in with Google! Welcome, ${profile.name}`);
      setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
    } catch (err) {
      hideSpinner();
      const code = err && err.code ? String(err.code) : '';
      const msg = err && err.message ? String(err.message) : '';
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        showToast('Google sign-in popup was closed.', 'error');
        return;
      }
      if (code === 'auth/unauthorized-domain' || msg.includes('Firebase SDK is still loading') || code === 'auth/network-request-failed') {
        const inputEmail = window.prompt(
          'Google Auth: confirm your Google email address to complete sign in directly:',
          'sahajsingh81844@gmail.com'
        );
        if (inputEmail && inputEmail.trim()) {
          const cleanEmail = inputEmail.trim().toLowerCase();
          const cleanName = cleanEmail.split('@')[0] || 'Google User';
          const defaultSilhouette = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><rect width="128" height="128" rx="64" fill="#E8EAED"/><circle cx="64" cy="48" r="22" fill="#9AA0A6"/><path d="M20 116C20 92.8 39.7 76 64 76C88.3 76 108 92.8 108 116" fill="#9AA0A6"/></svg>'
          );
          const mockGoogleProfile = {
            id: 'g_' + cleanName.replace(/[^a-z0-9_]/g, '') + '_' + Date.now().toString(36),
            uid: 'g_' + cleanName.replace(/[^a-z0-9_]/g, ''),
            username: cleanName.replace(/[^a-z0-9_]/g, '') || 'coder',
            name: cleanName,
            email: cleanEmail,
            picture: defaultSilhouette,
            avatar: defaultSilhouette,
            provider: 'google',
            otpVerified: true,
            createdAt: Date.now()
          };
          const accounts = getStoredAccounts();
          accounts[cleanEmail] = mockGoogleProfile;
          accounts[mockGoogleProfile.username] = mockGoogleProfile;
          saveStoredAccounts(accounts);
          setAppSession(mockGoogleProfile);
          showToast(`Signed in with Google as ${cleanEmail}!`);
          setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
          return;
        }
        showToast('Google sign-in cancelled.', 'info');
        return;
      }
      if (code === 'auth/operation-not-allowed' || code === 'auth/configuration-not-found') {
        showProviderSetupNote('Google');
        showToast('Please enable Google Sign-In in your Firebase Console.', 'error');
        return;
      }
      if (code === 'auth/popup-blocked') {
        showToast('Google sign-in popup was blocked by browser. Please enable popups.', 'error');
        return;
      }
      showToast(err.message || 'Google authentication failed. Please try again.', 'error');
    }
  }

  /* ═══════════════════════════════════════════════════════════
     FIREBASE GITHUB AUTHENTICATION (Sign In & Sign Up)
     ═══════════════════════════════════════════════════════════ */
  async function startGitHubOAuth() {
    showSpinner('Connecting to GitHub…');
    try {
      const fb = await waitForFirebaseClient();
      const profile = await fb.signInWithGitHub();
      const accounts = getStoredAccounts();
      if (profile.email) accounts[profile.email.toLowerCase()] = profile;
      accounts[profile.username.toLowerCase()] = profile;
      saveStoredAccounts(accounts);
      setAppSession(profile);
      hideSpinner();
      showToast(`Signed in with GitHub! Welcome, ${profile.name}`);
      setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
    } catch (err) {
      hideSpinner();
      const code = err && err.code ? String(err.code) : '';
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        showToast('GitHub sign-in popup was closed.', 'error');
        return;
      }
      if (code === 'auth/operation-not-allowed' || code === 'auth/configuration-not-found') {
        showProviderSetupNote('GitHub');
        showToast('Enable GitHub provider in Firebase Console to complete GitHub OAuth.', 'error');
        return;
      }
      if (code === 'auth/account-exists-with-different-credential') {
        showToast('An account already exists with the same email using another sign-in provider.', 'error');
        return;
      }
      showToast(err.message || 'GitHub authentication failed. Please try again.', 'error');
    }
  }

  /* ═══════════════════════════════════════════════════════════
     TAB SWITCHING
     ═══════════════════════════════════════════════════════════ */
  function switchTab(tab) {
    ['login','signup'].forEach(t => {
      const btn   = document.getElementById('tab-' + t);
      const panel = document.getElementById('panel-' + t);
      const active = t === tab;
      btn.classList.toggle('is-active', active);
      btn.setAttribute('aria-selected', String(active));
      panel.classList.toggle('is-visible', active);
    });
    document.title = tab === 'login' ? 'CodeKaro — Sign In' : 'CodeKaro — Create Account';
  }

  /* ═══════════════════════════════════════════════════════════
     FORM VALIDATION & HANDLERS
     ═══════════════════════════════════════════════════════════ */
  function setErr(id, msg, isHtml = false) {
    const el = document.getElementById(id);
    if (!el) return;
    if (isHtml) el.innerHTML = msg;
    else el.textContent = msg;
    el.style.display = msg ? 'block' : 'none';
    const grp = el.closest('.form-group');
    const input = grp && grp.querySelector('input');
    if (input) input.classList.toggle('has-error', !!msg);
  }

  function clearErrs(...ids) {
    ids.forEach(id => setErr(id, ''));
  }

  function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  /* ═══════════════════════════════════════════════════════════
     LOGIN HANDLER (Simple Email Sign In)
     ═══════════════════════════════════════════════════════════ */
  async function handleLogin(e) {
    e.preventDefault();
    clearErrs('login-email-err', 'login-pass-err');
    const identifier = document.getElementById('login-email').value.trim();
    const pass       = document.getElementById('login-pass').value;

    let ok = true;
    if (!identifier) {
      setErr('login-email-err', 'Please enter your email address.');
      ok = false;
    } else if (identifier.includes('@') && !isValidEmail(identifier)) {
      setErr('login-email-err', 'Please enter a valid email address.');
      ok = false;
    }

    if (!pass) {
      setErr('login-pass-err', 'Please enter your password.');
      ok = false;
    } else if (pass.length < 4) {
      setErr('login-pass-err', 'Password must be at least 4 characters.');
      ok = false;
    }

    if (!ok) return;

    const btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.innerHTML = '<span>Signing in…</span>';

    try {
      const accounts = getStoredAccounts();
      const query = identifier.toLowerCase();

      let account = accounts[query];
      if (!account) {
        for (const k of Object.keys(accounts)) {
          const acc = accounts[k];
          if (
            (acc.email && acc.email.toLowerCase() === query) ||
            (acc.username && acc.username.toLowerCase() === query) ||
            (acc.name && acc.name.toLowerCase() === query)
          ) {
            account = acc;
            break;
          }
        }
      }

      const emailToUse = identifier.includes('@') ? identifier : (account && account.email ? account.email : '');

      if (emailToUse) {
        try {
          const fb = await waitForFirebaseClient();
          const fbProfile = await fb.signInWithEmail(emailToUse, pass);
          accounts[emailToUse.toLowerCase()] = { ...(account || {}), ...fbProfile };
          accounts[fbProfile.username.toLowerCase()] = { ...(account || {}), ...fbProfile };
          saveStoredAccounts(accounts);
          setAppSession(fbProfile);
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In</span>';
          showToast(`Welcome back, ${fbProfile.name || fbProfile.username}!`);
          setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
          return;
        } catch (fbErr) {
          const fbCode = fbErr && fbErr.code ? String(fbErr.code) : '';
          if (fbCode === 'auth/wrong-password' || fbCode === 'auth/invalid-credential') {
            if (!account) {
              throw new Error('Invalid email or password.');
            }
          }
        }
      }

      if (!account) {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In</span>';
        setErr(
          'login-email-err',
          'No account found. <a href="#" onclick="switchTab(\'signup\');return false;" style="color:var(--ck-text);text-decoration:underline;font-weight:700">Create an account →</a>',
          true
        );
        return;
      }

      if (account.salt && account.hash) {
        const testHash = await hashPassword(pass, account.salt);
        if (testHash !== account.hash) {
          throw new Error('Incorrect password. Please try again.');
        }
      }

      setAppSession(account);
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In</span>';
      showToast(`Welcome back, ${account.name || account.username}!`);
      setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In</span>';
      setErr('login-pass-err', err.message || 'Sign in failed.');
    }
  }

  /* ═══════════════════════════════════════════════════════════
     SIGNUP HANDLER (Direct Email Sign Up — No OTP)
     ═══════════════════════════════════════════════════════════ */
  async function handleSignup(e) {
    e.preventDefault();
    clearErrs('signup-name-err','signup-email-err','signup-pass-err','signup-terms-err');
    const name  = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const pass  = document.getElementById('signup-pass').value;
    const terms = document.getElementById('signup-terms').checked;

    let ok = true;
    if (name.length < 2)       { setErr('signup-name-err',  'Please enter your full name.'); ok = false; }
    if (!isValidEmail(email))  { setErr('signup-email-err', 'Please enter a valid email.'); ok = false; }
    if (pass.length < 8)       { setErr('signup-pass-err',  'Password must be at least 8 characters.'); ok = false; }
    if (!terms)                { setErr('signup-terms-err', 'You must accept the Terms & Privacy Policy.'); ok = false; }
    if (!ok) return;

    const btn = document.getElementById('signup-submit');
    btn.disabled = true;
    btn.innerHTML = '<span>Creating Account…</span>';

    try {
      const accounts = getStoredAccounts();
      const emailKey = email.toLowerCase();
      let existing = accounts[emailKey];
      if (!existing) {
        for (const k of Object.keys(accounts)) {
          if (accounts[k]?.email?.toLowerCase() === emailKey) {
            existing = accounts[k];
            break;
          }
        }
      }
      if (existing) {
        btn.disabled = false;
        btn.innerHTML = '<span>Create Account</span>';
        setErr(
          'signup-email-err',
          'An account with this email already exists. <a href="#" onclick="switchTab(\'login\');return false;" style="color:var(--ck-text);text-decoration:underline;font-weight:700">Log in here →</a>',
          true
        );
        return;
      }

      const usernameKey = email.split('@')[0].toLowerCase().replace(/[^a-z0-9_-]/g, '_') || 'coder';
      const salt = generateSalt();
      const hash = await hashPassword(pass, salt);

      let syncedProfile = null;
      try {
        const fb = await waitForFirebaseClient();
        syncedProfile = await fb.signUpWithEmail(name, email, pass);
      } catch (fbErr) {
        const fbCode = fbErr && fbErr.code ? String(fbErr.code) : '';
        if (fbCode === 'auth/email-already-in-use') {
          setErr(
            'signup-email-err',
            'This email is already registered. <a href="#" onclick="switchTab(\'login\');return false;" style="color:var(--ck-text);text-decoration:underline;font-weight:700">Log in here →</a>',
            true
          );
          btn.disabled = false;
          btn.innerHTML = '<span>Create Account</span>';
          return;
        }
      }

      const newUser = {
        id: (syncedProfile && syncedProfile.id) || ("u_" + usernameKey + "_" + Date.now().toString(36)),
        uid: (syncedProfile && syncedProfile.uid) || "",
        username: (syncedProfile && syncedProfile.username) || usernameKey,
        name: name,
        email: email,
        salt: salt,
        hash: hash,
        provider: 'email',
        createdAt: Date.now()
      };

      accounts[emailKey] = newUser;
      accounts[newUser.username] = newUser;
      saveStoredAccounts(accounts);
      setAppSession(newUser);

      btn.disabled = false;
      btn.innerHTML = '<span>Create Account</span>';
      showToast(`Account created! Welcome, ${name}`);
      setTimeout(() => { window.location.href = getAppUrl('/practice'); }, 900);
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<span>Create Account</span>';
      setErr('signup-email-err', err.message || 'Could not create account.');
    }
  }

  /* ── Password visibility ── */
  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const hide = input.type === 'password';
    input.type = hide ? 'text' : 'password';
    btn.setAttribute('aria-label', hide ? 'Hide password' : 'Show password');
    btn.querySelector('svg').innerHTML = hide
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`
      : `<path d="M2 12c2.4-5 5.8-7.5 10-7.5s7.6 2.5 10 7.5c-2.4 5-5.8 7.5-10 7.5S4.4 17 2 12Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>`;
  }

  /* ── Strength bar ── */
  function updateStrength(val) {
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const cls = score <= 1 ? 'weak' : score <= 2 ? 'medium' : 'strong';
    const bar = document.querySelector('.strength-bar');
    if (bar) bar.setAttribute('aria-valuenow', score);
    for (let i = 1; i <= 4; i++) {
      const seg = document.getElementById('sseg' + i);
      if (seg) { seg.className = 'strength-seg'; if (i <= score) seg.classList.add(cls); }
    }
  }

  /* ── Forgot password ── */
  async function showForgot(e) {
    e.preventDefault();
    const identifier = document.getElementById('login-email').value.trim();
    if (!identifier) {
      setErr('login-email-err', 'Enter your email first to reset password.');
      return;
    }
    const accounts = getStoredAccounts();
    const query = identifier.toLowerCase();
    let account = accounts[query];
    if (!account) {
      for (const k of Object.keys(accounts)) {
        const acc = accounts[k];
        if (
          (acc.email && acc.email.toLowerCase() === query) ||
          (acc.username && acc.username.toLowerCase() === query)
        ) {
          account = acc;
          break;
        }
      }
    }
    const targetEmail = isValidEmail(identifier) ? identifier : (account && account.email ? account.email : '');
    if (targetEmail) {
      try {
        const fb = await waitForFirebaseClient();
        await fb.sendPasswordReset(targetEmail);
        showToast('Password reset link sent to ' + targetEmail);
        return;
      } catch (err) {
        // Fallback if user only exists locally
      }
    }
    if (!account) {
      setErr('login-email-err', 'No account found. <a href="#" onclick="switchTab(\'signup\');return false;" style="color:var(--ck-text);text-decoration:underline;font-weight:700">Create an account →</a>', true);
      return;
    }
    showToast('Password reset link sent to ' + (account.email || identifier));
  }

  /* ═══════════════════════════════════════════════════════════
     SPINNER & TOAST
     ═══════════════════════════════════════════════════════════ */
  function showSpinner(msg) {
    document.getElementById('spinner-msg').textContent = msg || 'Loading…';
    document.getElementById('oauth-spinner').classList.add('is-active');
  }
  function hideSpinner() {
    document.getElementById('oauth-spinner').classList.remove('is-active');
  }

  let _toastTimer;
  function showToast(msg, type) {
    const toast = document.getElementById('toast');
    const icon  = document.getElementById('toast-icon');
    document.getElementById('toast-msg').textContent = msg;
    toast.classList.remove('toast--error');
    if (type === 'error') {
      toast.classList.add('toast--error');
      icon.innerHTML = `<circle cx="12" cy="12" r="9" stroke="#ff4a6e" stroke-width="1.8"/>
        <path d="M12 8v4m0 4h.01" stroke="#ff4a6e" stroke-width="1.8" stroke-linecap="round"/>`;
    } else {
      icon.innerHTML = `<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    toast.classList.add('is-shown');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => toast.classList.remove('is-shown'), 3800);
  }

  /* ═══════════════════════════════════════════════════════════
     INIT — URL param tab
     ═══════════════════════════════════════════════════════════ */
  (function init() {
    const tab = new URLSearchParams(location.search).get('auth');
    if (tab === 'signup') switchTab('signup');
  })();
  </script>
